<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كلمات - Kalimat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: #151c2c;
      --bg-input: #1e293b;
      --border-color: #2e3a52;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary-color: #38bdf8;
      --primary-hover: #0284c7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; }

    .navbar {
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 0.75rem 1.5rem;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 100;
    }
    .brand { font-size: 1.4rem; font-weight: 700; color: var(--primary-color); display: flex; align-items: center; gap: 0.5rem; }

    .app-container { max-width: 680px; margin: 1.5rem auto; padding: 0 1rem; }

    .publisher-card {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: 12px; padding: 1rem; margin-bottom: 1.5rem;
    }
    .publisher-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%; background: var(--primary-color);
      color: #000; display: flex; align-items: center; justify-content: center; font-weight: bold;
    }
    .publisher-input {
      width: 100%; background: var(--bg-input); border: 1px solid var(--border-color);
      border-radius: 8px; color: var(--text-main); padding: 0.75rem; font-size: 1rem;
      resize: none; min-height: 80px; outline: none; margin-bottom: 0.75rem;
    }
    .publisher-actions { display: flex; justify-content: space-between; align-items: center; }
    .btn-publish {
      background: var(--primary-color); color: #0b0f19; border: none;
      padding: 0.5rem 1.25rem; border-radius: 6px; font-weight: 700; cursor: pointer;
    }

    .feed-title { color: var(--text-muted); margin-bottom: 1rem; font-size: 1rem; }
    .post-card {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: 12px; padding: 1rem; margin-bottom: 1rem;
    }
    .post-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
    .post-author { display: flex; align-items: center; gap: 0.5rem; font-weight: 600; }
    .post-time { font-size: 0.8rem; color: var(--text-muted); }
    .post-content { font-size: 1rem; line-height: 1.5; margin: 0.75rem 0; white-space: pre-wrap; }
    .post-footer {
      display: flex; gap: 1rem; border-top: 1px solid var(--border-color);
      padding-top: 0.5rem; color: var(--text-muted); font-size: 0.85rem;
    }
    .action-btn { cursor: pointer; display: flex; align-items: center; gap: 0.3rem; }
    .action-btn:hover { color: var(--primary-color); }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="brand"><i class="fa-solid fa-feather-pointed"></i> كلمات</div>
  </nav>

  <div class="app-container">
    <div class="publisher-card">
      <div class="publisher-header">
        <div class="avatar">ك</div>
        <span>أنشئ منشورك</span>
      </div>
      <textarea id="postInput" class="publisher-input" placeholder="ماذا يدور في ذهنك؟"></textarea>
      <div class="publisher-actions">
        <span style="color: var(--text-muted); font-size: 0.85rem;"><i class="fa-solid fa-globe"></i> عام</span>
        <button class="btn-publish" id="publishBtn">نشر المنشور</button>
      </div>
    </div>

    <div class="feed-title"><i class="fa-solid fa-stream"></i> المنشورات الحالية</div>
    <div id="feed"></div>
  </div>

  <script>
    // نظام إدارة المنشورات التفاعلي المحلي
    const postInput = document.getElementById('postInput');
    const publishBtn = document.getElementById('publishBtn');
    const feed = document.getElementById('feed');

    // تحميل المنشورات المخزنة
    let posts = JSON.parse(localStorage.getItem('kalimat_posts') || '[]');

    function renderPosts() {
      feed.innerHTML = '';
      if (posts.length === 0) {
        feed.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:2rem;">لا توجد منشورات بعد. كن أول من ينشر!</div>';
        return;
      }

      posts.forEach((post, index) => {
        const card = document.createElement('div');
        card.className = 'post-card';
        card.innerHTML = `
          <div class="post-header">
            <div class="post-author">
              <div class="avatar" style="width:30px; height:30px; font-size:0.75rem;">ك</div>
              <span>مستخدم كلمات</span>
            </div>
            <div class="post-time">${post.time}</div>
          </div>
          <div class="post-content">${post.content}</div>
          <div class="post-footer">
            <div class="action-btn" onclick="toggleLike(${index})">
              <i class="fa-regular fa-heart"></i> <span>${post.likes || 0}</span> إعجاب
            </div>
          </div>
        `;
        feed.appendChild(card);
      });
    }

    publishBtn.addEventListener('click', () => {
      const text = postInput.value.trim();
      if (!text) return;

      const newPost = {
        content: text,
        time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }),
        likes: 0
      };

      posts.unshift(newPost);
      localStorage.setItem('kalimat_posts', JSON.stringify(posts));
      postInput.value = '';
      renderPosts();
    });

    window.toggleLike = function(index) {
      posts[index].likes = (posts[index].likes || 0) + 1;
      localStorage.setItem('kalimat_posts', JSON.stringify(posts));
      renderPosts();
    };

    // تشغيل العرض الأولي
    renderPosts();
  </script>
</body>
</html>
