<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كلمات - Kalimat</title>
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: #151c2c;
      --bg-input: #1e293b;
      --border-color: #2e3a52;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary-color: #38bdf8;
      --primary-hover: #0284c7;
      --accent-color: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar */
    .navbar {
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 0.75rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary-color);
    }

    .brand i {
      font-size: 1.75rem;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--bg-input);
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      font-size: 0.9rem;
    }

    /* Container Layout */
    .app-container {
      max-width: 720px;
      width: 100%;
      margin: 1.5rem auto;
      padding: 0 1rem;
      flex: 1;
    }

    /* Publisher Card */
    .publisher-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .publisher-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--primary-color);
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .publisher-input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      padding: 0.8rem;
      font-size: 1rem;
      resize: none;
      min-height: 90px;
      outline: none;
      transition: border-color 0.2s;
    }

    .publisher-input:focus {
      border-color: var(--primary-color);
    }

    .publisher-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.75rem;
    }

    .btn-publish {
      background: var(--primary-color);
      color: #0b0f19;
      border: none;
      padding: 0.6rem 1.5rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: background 0.2s;
    }

    .btn-publish:hover {
      background: var(--primary-hover);
    }

    /* Timeline Feed */
    .feed-title {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .post-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .post-author {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 600;
    }

    .post-time {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .post-content {
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 1rem;
      white-space: pre-line;
    }

    .post-footer {
      display: flex;
      gap: 1.5rem;
      border-top: 1px solid var(--border-color);
      padding-top: 0.75rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .action-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    .action-item:hover {
      color: var(--primary-color);
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="brand">
      <i class="fa-solid fa-feather-pointed"></i>
      <span>كلمات</span>
    </div>
    <div class="user-profile">
      <i class="fa-solid fa-user"></i>
      <span>مستخدم كلمات</span>
    </div>
  </nav>

  <!-- Main App Layout -->
  <div class="app-container">
    
    <!-- Publisher Block -->
    <div class="publisher-card">
      <div class="publisher-header">
        <div class="avatar">ك</div>
        <span style="font-weight: 600;">إنشاء منشور جديد</span>
      </div>
      <textarea id="postInput" class="publisher-input" placeholder="عَبّر عن أفكارك في كلمات..."></textarea>
      <div class="publisher-actions">
        <div style="color: var(--text-muted); font-size: 0.85rem;">
          <i class="fa-solid fa-globe"></i> منشور عام
        </div>
        <button class="btn-publish" onclick="submitPost()">
          <i class="fa-solid fa-paper-plane"></i> نشر
        </button>
      </div>
    </div>

    <!-- Feed Section -->
    <div class="feed-title">
      <i class="fa-solid fa-stream"></i> المنشورات الأخيرة
    </div>

    <div id="feed">
      <!-- المنشورات ستظهر هنا بتصميم كامل -->
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // إعدادات Firebase
    const firebaseConfig = {
      databaseURL: "https://kalimat-4e432-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const postsRef = ref(db, 'posts');

    window.submitPost = function() {
      const input = document.getElementById('postInput');
      const text = input.value.trim();
      if (!text) return;

      push(postsRef, {
        content: text,
        timestamp: Date.now()
      }).then(() => {
        input.value = '';
      });
    };

    onValue(postsRef, (snapshot) => {
      const feed = document.getElementById('feed');
      feed.innerHTML = '';
      const data = snapshot.val();
      if (data) {
        Object.values(data).reverse().forEach(post => {
          const card = document.createElement('div');
          card.className = 'post-card';
          const date = new Date(post.timestamp).toLocaleString('ar-EG');
          card.innerHTML = `
            <div class="post-header">
              <div class="post-author">
                <div class="avatar" style="width:32px; height:32px; font-size:0.8rem;">ك</div>
                <span>مستخدم كلمات</span>
              </div>
              <div class="post-time">${date}</div>
            </div>
            <div class="post-content">${post.content}</div>
            <div class="post-footer">
              <div class="action-item"><i class="fa-regular fa-heart"></i> إعجاب</div>
              <div class="action-item"><i class="fa-regular fa-comment"></i> تعليق</div>
            </div>
          `;
          feed.appendChild(card);
        });
      }
    });
  </script>
</body>
</html>
